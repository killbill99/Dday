<!DOCTYPE html>
<html>

<head>

<title>Wish On Their Birthday</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

body{
margin:0;
background:linear-gradient(135deg,#111,#1c1c1c,#111);
color:white;
font-family:'Cinzel',serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
}

#card{
background:#181818;
border:2px solid #444;
border-radius:14px;
padding:25px;
width:95%;
max-width:380px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.8);
}

h2{
font-family:'UnifrakturCook',cursive;
font-size:26px;
margin-bottom:6px;
}

#clock{
font-size:13px;
color:#bbb;
margin-bottom:15px;
}

input{
width:90%;
padding:12px;
margin:6px;
border-radius:6px;
border:none;
font-size:14px;
font-family:'Cinzel',serif;
}

button{
padding:11px 18px;
margin-top:10px;
border:none;
border-radius:6px;
background:#ff4444;
color:white;
font-family:'Cinzel',serif;
font-size:14px;
}

#result{
margin-top:20px;
font-size:18px;
line-height:1.5;
color:#ffb3b3;
}

#shot{
display:none;
background:#333;
margin-top:12px;
}

</style>

</head>

<body>

<div id="card">

<h2>Wish On Their Birthday</h2>

<div id="clock"></div>

<p style="font-size:14px;color:#aaa">
Write your wishy wish
</p>

<input id="name" placeholder="Your name">

<input id="wish" placeholder="Your wish">

<button onclick="reply()">Send Wish</button>

<div id="result"></div>

<button id="shot" onclick="screenshot()">📸 Screenshot</button>

</div>

<script>

/* clock */

function updateClock(){

let now=new Date()

let time=now.toLocaleTimeString()
let date=now.toDateString()

document.getElementById("clock").innerText=date+" • "+time

}

setInterval(updateClock,1000)
updateClock()

/* replies */

const replies=[

"bas ho gaya?",

"party mat mangiyo, gas khatam h.",

"gas do party lo",

"itne me mutton nhi milta",

"has re halkat joke maara",

"chal tk, batli lekar pahuch jaldi",

"are soniyo, khus kar ditta",

"bday wish kitta tu? Mennu lag rehyasi condolences ditta.",

"ha tk bas ye baate sab ko na bataiyo",

"ye baat kewal hamare beech rahegi."

]

function reply(){

let name=document.getElementById("name").value
let wish=document.getElementById("wish").value.toLowerCase()

let line=replies[Math.floor(Math.random()*replies.length)]

document.getElementById("result").innerText=name+", "+line

document.getElementById("shot").style.display="inline-block"

}

/* screenshot */

function screenshot(){

html2canvas(document.querySelector("#card")).then(canvas=>{

let link=document.createElement("a")
link.download="birthday_reply.png"
link.href=canvas.toDataURL()
link.click()

})

}

</script>

</body>

</html>
