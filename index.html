<!DOCTYPE html>
<html>
<head>

<title>Birthday Wish Analysis Lab</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&family=Hind:wght@400;500&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

body{
background:#0f0f0f;
color:white;
font-family:'Poppins',sans-serif;
margin:0;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

#card{
background:#1b1b1b;
padding:25px;
border-radius:14px;
width:95%;
max-width:380px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

h2{
margin-bottom:10px;
font-weight:400;
}

input{
width:90%;
padding:12px;
margin:6px;
border-radius:6px;
border:none;
font-size:15px;
}

button{
padding:10px 18px;
margin-top:10px;
border:none;
border-radius:6px;
background:#ff4444;
color:white;
font-size:14px;
}

#loading{
margin-top:15px;
color:#aaa;
display:none;
}

#result{
margin-top:18px;
font-size:17px;
font-family:'Hind',sans-serif;
line-height:1.5;
color:#ff7777;
}

#meter{
margin-top:12px;
font-size:14px;
color:#bbb;
}

#again{
display:none;
background:#444;
}

#shot{
display:none;
background:#333;
margin-top:10px;
}

</style>

</head>

<body>

<div id="card">

<h2>Birthday Wish Analysis Lab 🎂</h2>

<p style="font-size:13px;color:#aaa">
Write your wish. The system will evaluate its emotional depth.
</p>

<input id="name" placeholder="Your name">

<input id="wish" placeholder="Your birthday wish">

<button onclick="analyze()">Submit</button>

<div id="loading">
Analyzing emotional sincerity...<br>
Consulting existential database...
</div>

<div id="result"></div>

<div id="meter"></div>

<button id="again" onclick="generate()">Another interpretation</button>

<button id="shot" onclick="screenshot()">📸 Capture this humiliation</button>

</div>

<script>

let name=""
let wish=""

const replies=[

`तुम्हारा wish पढ़कर लगा
जैसे किसी ने औपचारिकता निभा दी हो।
कभी-कभी लोग शब्द लिखते हैं,
पर उनमें दिल शामिल नहीं होता।`,

`तुमने मुझे wish तो किया,
मगर जो खालीपन इस wish में है
वही शायद हमारी दोस्ती में भी है।`,

`अजीब बात है…
तुमने birthday wish किया
और मुझे लगा
जैसे किसी ने condolence message भेज दिया हो।`,

`मैं तुम्हारे wish को समझने की कोशिश कर रहा था…
मगर शायद इसमें समझने लायक
कुछ था ही नहीं।`,

`तुम्हारा wish पढ़कर लगा
जैसे WhatsApp status से
आधी लाइन उठाकर भेज दी हो।`,

`कभी-कभी लोग wish इसलिए लिखते हैं
क्योंकि keyboard मौजूद होता है।`,

`तुमने "happy birthday" लिखा है…
और मैं सोच रहा हूँ
क्या हमारी दोस्ती भी इतनी ही छोटी है।`

]

function analyze(){

name=document.getElementById("name").value
wish=document.getElementById("wish").value

document.getElementById("loading").style.display="block"
document.getElementById("result").innerText=""
document.getElementById("meter").innerText=""

setTimeout(generate,2000)

}

function generate(){

document.getElementById("loading").style.display="none"

let line=replies[Math.floor(Math.random()*replies.length)]

document.getElementById("result").innerText=name+",\n\n"+line

let effort=Math.floor(Math.random()*20)+5
let embarrassment=Math.floor(Math.random()*40)+60

document.getElementById("meter").innerText=
"Effort detected: "+effort+"%\nEmbarrassment level: "+embarrassment+"%"

document.getElementById("again").style.display="inline-block"
document.getElementById("shot").style.display="inline-block"

}

function screenshot(){

html2canvas(document.querySelector("#card")).then(canvas=>{

let link=document.createElement("a")
link.download="wish_analysis.png"
link.href=canvas.toDataURL()
link.click()

})

}

</script>

</body>
</html>
